<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bebo · Privado</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.4rem;margin:18px 0 4px;text-shadow:0 0 12px #f0f,0 0 30px #f0f}
.sub{color:#8a8aa3;font-size:.85rem;margin-bottom:22px}
.panel{width:100%;max-width:420px;background:#14141f;border:1px solid #2a2a3f;border-radius:16px;padding:20px;box-shadow:0 0 24px rgba(255,0,255,.12)}
textarea{width:100%;min-height:110px;background:#0d0d16;border:1px solid #3a3a55;border-radius:12px;color:#fff;padding:12px;font-size:1rem;resize:vertical}
textarea:focus{outline:none;border-color:#0ff;box-shadow:0 0 12px rgba(0,255,255,.35)}
.btn{display:block;width:100%;margin-top:12px;padding:14px;border:none;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer;color:#fff}
.btn-text{background:linear-gradient(135deg,#f0f,#a0f);box-shadow:0 0 18px rgba(255,0,255,.5)}
.btn-audio{background:linear-gradient(135deg,#0ff,#08f);box-shadow:0 0 18px rgba(0,255,255,.5)}
.btn-audio.rec{background:linear-gradient(135deg,#f44,#f0f);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 30px rgba(255,0,80,.9)}}
.btn:disabled{opacity:.5;cursor:default}
#status{margin-top:14px;min-height:1.4em;text-align:center;font-size:.92rem;color:#0ff}
.divider{display:flex;align-items:center;margin:18px 0;color:#555;font-size:.8rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#2a2a3f;margin:0 10px}
.hist{margin-top:18px;width:100%;max-width:420px}
.hist h3{font-size:.85rem;color:#8a8aa3;margin-bottom:8px}
.msg{background:#14141f;border:1px solid #2a2a3f;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:.9rem}
.msg small{color:#666;display:block;margin-top:4px}
</style>
</head>
<body>
<h1>💬 Bebo · Privado</h1>
<div class="sub">Solo para Lali · nadie más ve esto</div>
<div class="panel">
<textarea id="txt" placeholder="Escribí tu indicación para Bebo..."></textarea>
<button class="btn btn-text" id="sendTxt">Enviar texto</button>
<div class="divider">o</div>
<button class="btn btn-audio" id="recBtn">🎤 Mantener para grabar audio</button>
<div id="status"></div>
</div>
<div class="hist"><h3>Enviados</h3><div id="list"></div></div>
<script>
const SB_URL='https://lhatspnvxujisxyigvbp.supabase.co';
const SB_KEY='sb_publishable_mtsrlTdaQCgMKzfOobIpiQ_G_Io0CiH';
const H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
const statusEl=document.getElementById('status'),listEl=document.getElementById('list');
function say(t){statusEl.textContent=t;setTimeout(()=>statusEl.textContent='',4000)}
function addHist(t){const d=document.createElement('div');d.className='msg';d.innerHTML=t+'<small>'+new Date().toLocaleTimeString()+'</small>';listEl.prepend(d)}
async function sendDir(tipo,contenido,audio_url){
  const r=await fetch(SB_URL+'/rest/v1/directivas_lali',{method:'POST',headers:H,body:JSON.stringify({tipo,contenido,audio_url})});
  if(!r.ok)throw new Error('Error '+r.status);
}
document.getElementById('sendTxt').onclick=async()=>{
  const v=document.getElementById('txt').value.trim();
  if(!v)return say('Escribí algo primero');
  say('Enviando...');try{await sendDir('texto',v,null);document.getElementById('txt').value='';addHist('📝 '+v);say('✅ Enviado a Bebo')}catch(e){say('❌ Error, probá de nuevo')}
};
// Audio
let mr,chunks,rec=false;
const recBtn=document.getElementById('recBtn');
async function startRec(){
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mr=new MediaRecorder(s);mr.ondataavailable=e=>chunks.push(e.data);mr.start();rec=true;recBtn.classList.add('rec');recBtn.textContent='🔴 Grabando... soltá para enviar';say('Grabando...')}
  catch(e){say('❌ No se pudo acceder al micrófono')}
}
async function stopRec(){
  if(!rec)return;rec=false;recBtn.classList.remove('rec');recBtn.textContent='🎤 Mantener para grabar audio';
  mr.onstop=async()=>{
    const blob=new Blob(chunks,{type:'audio/webm'});
    say('Subiendo audio...');
    try{
      const fn='lali_'+Date.now()+'.webm';
      const up=await fetch(SB_URL+'/storage/v1/object/directivas-audio/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'audio/webm'},body:blob});
      if(!up.ok)throw new Error('upload');
      await sendDir('audio','🎤 Audio de Lali',SB_URL+'/storage/v1/object/public/directivas-audio/'+fn);
      addHist('🎤 Audio enviado');say('✅ Audio enviado a Bebo');
    }catch(e){say('❌ Error al subir el audio')}
  };mr.stop();mr.stream.getTracks().forEach(t=>t.stop());
}
recBtn.addEventListener('pointerdown',e=>{e.preventDefault();startRec()});
['pointerup','pointerleave','pointercancel'].forEach(ev=>recBtn.addEventListener(ev,stopRec));
</script>
</body>
</html>
