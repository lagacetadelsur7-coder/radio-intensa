<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Charla privada</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0e0e1e;color:#fff;font-family:system-ui,-apple-system,sans-serif}
  header{padding:14px 16px;border-bottom:1px solid #333;text-align:center}
  header h1{font-size:18px;margin:0}
  header p{font-size:12px;color:#aaa;margin:4px 0 0}
  header button{background:none;border:0;color:#00e5ff;font-size:12px;margin-top:6px}
  #who{padding:40px 20px;text-align:center}
  #who h2{font-size:18px}
  #who button{display:block;width:100%;max-width:300px;margin:12px auto;padding:16px;font-size:18px;border-radius:14px;border:2px solid #ff2fd6;background:#1a1a2e;color:#fff}
  #who button.ce{border-color:#00e5ff}
  #chat{display:none;max-width:640px;margin:0 auto;padding:12px 12px 110px}
  .msg{max-width:80%;padding:10px 14px;border-radius:16px;margin:8px 0;font-size:16px;line-height:1.4;word-wrap:break-word}
  .msg small{display:block;font-size:11px;opacity:.6;margin-top:4px}
  .mio{margin-left:auto;background:#00e5ff;color:#00222a;border-bottom-right-radius:4px}
  .otro{background:#2a2a44;border-bottom-left-radius:4px}
  #form{position:fixed;left:0;right:0;bottom:0;display:none;gap:8px;padding:10px;background:#14142a;border-top:1px solid #333;max-width:640px;margin:0 auto}
  #form input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid #444;background:#0e0e1e;color:#fff;font-size:16px}
  #form button{padding:12px 18px;border-radius:12px;border:0;background:#ff2fd6;color:#fff;font-size:16px;font-weight:700}
</style>
</head>
<body>
<header><h1>💬 Charla privada</h1><p>Solo Lali y César</p><button id="cambiar" style="display:none" onclick="salir()">Cambiar de usuario</button></header>
<div id="who">
  <h2>¿Quién sos?</h2>
  <button onclick="entrar('Lali')">💖 Soy Lali</button>
  <button class="ce" onclick="entrar('César')">Soy César</button>
</div>
<div id="chat"></div>
<div id="form"><input id="texto" placeholder="Escribí tu mensaje..." maxlength="500"><button onclick="enviar()">Enviar</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient("https://lhatspnvxujisxyigvbp.supabase.co", "sb_publishable_mtsrlTdaQCgMKzfOobIpiQ_G_Io0CiH");
const DESDE = "2026-10-25T00:00:00+00:00";
let yo = localStorage.getItem("cp_yo") || "";
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function hora(f){ try{ return new Date(f).toLocaleString("es-AR",{timeZone:"America/Argentina/Buenos_Aires",hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"}); }catch(e){ return ""; } }
function burbuja(m){
  const clase = m.nombre === yo ? "msg mio" : "msg otro";
  return '<div class="'+clase+'">'+esc(m.contenido)+'<small>'+m.nombre+' · '+hora(m.created_at)+'</small></div>';
}
async function cargar(){
  const {data} = await sb.from("instrucciones_privadas").select("nombre,contenido,created_at").in("nombre",["Lali","César"]).gte("created_at",DESDE).order("created_at",{ascending:true}).limit(200);
  if(data){
    document.getElementById("chat").innerHTML = data.length ? data.map(burbuja).join("") : "<p style='text-align:center;color:#888'>Todavía no hay mensajes. ¡Escribí el primero!</p>";
    window.scrollTo(0, document.body.scrollHeight);
  }
}
async function enviar(){
  const inp = document.getElementById("texto");
  const t = inp.value.trim();
  if(!t || !yo) return;
  inp.value = "";
  await sb.from("instrucciones_privadas").insert({nombre:yo, tipo:"texto", contenido:t, leido:false});
  cargar();
}
function entrar(n){
  yo = n;
  localStorage.setItem("cp_yo", n);
  document.getElementById("who").style.display = "none";
  document.getElementById("chat").style.display = "block";
  document.getElementById("form").style.display = "flex";
  document.getElementById("cambiar").style.display = "inline";
  cargar();
}
function salir(){
  yo = "";
  localStorage.removeItem("cp_yo");
  document.getElementById("who").style.display = "block";
  document.getElementById("chat").style.display = "none";
  document.getElementById("form").style.display = "none";
  document.getElementById("cambiar").style.display = "none";
}
document.getElementById("texto").addEventListener("keydown", e => { if(e.key === "Enter") enviar(); });
sb.channel("cp-live").on("postgres_changes", {event:"INSERT", schema:"public", table:"instrucciones_privadas"}, cargar).subscribe();
setInterval(cargar, 10000);
if(yo) entrar(yo);
</script>
</body>
</html>
